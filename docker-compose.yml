version: "3.9"

services:
  backend:
    build: .
    container_name: backend
    command: npm run dev

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb

    ports:
      - "27018:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: